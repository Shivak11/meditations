<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="Meditations. A reflection ritual for your own work, that keeps what you rejected.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="55%" stop-color="#15132b"/>
      <stop offset="100%" stop-color="#221a3a"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="60%" stop-color="#7c6bd6"/>
      <stop offset="100%" stop-color="#0b1020"/>
    </linearGradient>
    <style>
      .f     { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .tag   { font-size: 18px; font-weight: 400; fill: #a5a0c0; }
      .micro { font-size: 12px; font-weight: 700; fill: #6d6a8f; letter-spacing: 2.4px; }
      .date  { font-size: 11px; font-weight: 600; fill: #6d6a8f; }
      .chip  { font-size: 10px; font-weight: 800; letter-spacing: 0.8px; }
    </style>
  </defs>

  <rect width="1000" height="320" rx="20" fill="url(#bg)"/>
  <rect x="0" y="0" width="1000" height="5" fill="url(#accent)"/>

  <text class="f micro" x="64" y="86">MEDITATIONS.MD</text>
  <text class="f" x="64" y="166" font-size="72" font-weight="800" fill="#f8fafc">Meditations</text>
  <rect x="64" y="190" width="230" height="3" rx="1.5" fill="url(#rule)"/>
  <text class="f tag" x="64" y="232">A reflection ritual for your own work.</text>
  <text class="f tag" x="64" y="256">It keeps what you rejected.</text>

  <rect x="566" y="52" width="370" height="216" rx="14" fill="#120f24" stroke="#2c2650" stroke-width="1"/>

  <g>
    <text class="f date" x="590" y="88">2026-09-07</text>
    <rect x="590" y="96" width="196" height="7" rx="3.5" fill="#3b3566"/>
    <rect x="590" y="109" width="132" height="7" rx="3.5" fill="#2a2550"/>
    <rect x="828" y="80" width="84" height="19" rx="9.5" fill="#a78bfa"/>
    <text class="f chip" x="870" y="93" text-anchor="middle" fill="#160f2c">CONFIRMED</text>
  </g>

  <g>
    <text class="f date" x="590" y="146">2026-09-12</text>
    <rect x="590" y="154" width="170" height="7" rx="3.5" fill="#4a2a44"/>
    <rect x="590" y="167" width="108" height="7" rx="3.5" fill="#3a2137"/>
    <line x1="586" y1="157.5" x2="768" y2="157.5" stroke="#f472b6" stroke-width="1.5"/>
    <rect x="836" y="138" width="76" height="19" rx="9.5" fill="#f472b6"/>
    <text class="f chip" x="874" y="151" text-anchor="middle" fill="#2c0f22">REJECTED</text>
  </g>

  <g>
    <text class="f date" x="590" y="204">2026-09-21</text>
    <rect x="590" y="212" width="210" height="7" rx="3.5" fill="#3b3566"/>
    <rect x="590" y="225" width="96" height="7" rx="3.5" fill="#2a2550"/>
    <rect x="834" y="196" width="78" height="19" rx="9.5" fill="#5b5390"/>
    <text class="f chip" x="873" y="209" text-anchor="middle" fill="#e5e2f5">NARROWED</text>
  </g>

  <line x1="590" y1="248" x2="912" y2="248" stroke="#2c2650" stroke-width="1"/>
</svg>
